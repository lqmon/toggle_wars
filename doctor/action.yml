name: Flagsmith doctor
description: Fail CI when a self-hosted Flagsmith silently drops experiment events, is misconfigured, or is exposed.
author: FlagKit
branding:
  icon: activity
  color: green

inputs:
  api-url:
    description: Flagsmith base URL, e.g. https://flags.example.internal
    required: true
  environment-key:
    description: Client-side environment key (enables SDK and events checks)
    required: false
    default: ''
  admin-key:
    description: Admin API key (enables warehouse, traits and experiment-health checks). Pass a secret.
    required: false
    default: ''
  fail-on-warnings:
    description: Also fail on warnings
    required: false
    default: 'false'

outputs:
  failures:
    description: Number of failed checks
    value: ${{ steps.doctor.outputs.failures }}
  warnings:
    description: Number of warnings
    value: ${{ steps.doctor.outputs.warnings }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install FlagKit
      shell: bash
      run: cd "$GITHUB_ACTION_PATH/.." && npm ci --omit=dev --no-audit --no-fund --silent
    - name: Run flagkit doctor
      id: doctor
      shell: bash
      env:
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_ENV_KEY: ${{ inputs.environment-key }}
        FLAGSMITH_ADMIN_KEY: ${{ inputs.admin-key }}
        FAIL_ON_WARN: ${{ inputs.fail-on-warnings }}
      run: |
        set +e
        args=(doctor --api-url "$INPUT_API_URL")
        [ -n "$INPUT_ENV_KEY" ] && args+=(--env-key "$INPUT_ENV_KEY")
        node "$GITHUB_ACTION_PATH/../bin/flagkit.js" "${args[@]}"
        code=$?
        json=$(node "$GITHUB_ACTION_PATH/../bin/flagkit.js" "${args[@]}" --json 2>/dev/null)
        fails=$(jq -r '.fails' <<<"$json"); warns=$(jq -r '.warns' <<<"$json")
        echo "failures=$fails" >> "$GITHUB_OUTPUT"; echo "warnings=$warns" >> "$GITHUB_OUTPUT"
        {
          echo "### Flagsmith doctor: $fails failures, $warns warnings"
          echo '| | check | fix |'; echo '|---|---|---|'
          jq -r '.results[] | select(.status=="fail" or .status=="warn") | "| \(if .status=="fail" then "✖" else "⚠" end) | \(.title) | \(.fix // "") |"' <<<"$json"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$FAIL_ON_WARN" = "true" ] && [ "${warns:-0}" != "0" ]; then exit 1; fi
        exit $code
