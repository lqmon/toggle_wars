name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/*.test.js
      - name: Lint skill scripts
        run: bash -n skills/*/scripts/*.sh
      - name: Validate skills against the Agent Skills spec
        run: for s in skills/*/; do pipx run --spec "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref" skills-ref validate "$s"; done

  # Boots real self-hosted Flagsmith on a fresh runner and runs the whole journey.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: flagkit up (zero-click self-hosted Flagsmith + Experimentation)
        run: |
          time node bin/flagkit.js up
          # hand the local stack's keys to later steps (masked in logs)
          dev=$(jq -r '.environments[] | select(.name=="Development") | .api_key' .flagkit/state.json)
          adm=$(jq -r .masterKey .flagkit/state.json)
          echo "::add-mask::$adm"
          echo "DEV_KEY=$dev" >> "$GITHUB_ENV"; echo "ADMIN_KEY=$adm" >> "$GITHUB_ENV"

      - name: flagkit doctor (must report 0 failures)
        run: |
          source flagsmith.env
          node bin/flagkit.js doctor

      - name: Doctor as a GitHub Action (the reusable lqmon/toggle_wars/doctor action)
        uses: ./doctor
        with:
          api-url: http://localhost:8000

      - name: Demo experiment + simulated traffic
        run: |
          node bin/flagkit.js experiment create
          node bin/flagkit.js simulate --users 300
          node bin/flagkit.js experiment results

      - name: Install Flagsmith CLI
        run: |
          curl -fsSL https://get.flagsmith.com | sh -s -- --no-modify-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Agent Skill end to end (create → start → results → rollout → verify)
        run: |
          source flagsmith.env
          export FLAGSMITH_ENVIRONMENT=$FLAGSMITH_ENV_STAGING
          S=skills/flagsmith-experiment-rollout/scripts
          $S/preflight.sh
          out=$($S/create.sh cta_color control cta_click "CTA click rate" "CTA colour test" "Teal beats grey" 100 teal)
          echo "$out"
          id=$(echo "$out" | sed -n 's/^experiment_id=\([0-9]*\).*/\1/p')
          flagsmith api "api/v1/environments/$FLAGSMITH_ENVIRONMENT/experiments/$id/start/" -X POST --jq .status
          node bin/flagkit.js simulate --env Staging --flag cta_color --event cta_click --rates control=0.08,teal=0.2 --users 400
          sleep 5
          $S/results.sh "$id"
          $S/rollout.sh "$id" cta_color teal | tee rollout.txt
          grep -q 'eval: 5/5 -> teal' rollout.txt

      - name: plan, tail, explain, report, watch
        run: |
          node bin/flagkit.js plan --baseline 0.08 --lift 0.44 --daily 300 | tee plan.txt
          grep -q 'visitors per version' plan.txt
          node bin/flagkit.js tail --since 1h --once | tee tail.txt
          grep -q 'exposure' tail.txt
          node bin/flagkit.js explain ci-user-1 --flag hero_headline | tee explain.txt
          grep -q 'in experiment #' explain.txt
          node bin/flagkit.js report 1 --out report.md && cat report.md >> "$GITHUB_STEP_SUMMARY"
          grep -q '### Verdict' report.md
          # guardrail: a clearly worse variant must produce a pending, human-approved kill request
          node -e "import('./src/experiment.js').then(async (m) => { const { loadState } = await import('./src/config.js'); await m.createExperiment(loadState(), { envName: 'Development', flag: 'checkout_copy', variants: ['urgent'], event: 'checkout_click', name: 'Checkout copy guardrail', hypothesis: 'Urgent copy wins' }); })"
          node bin/flagkit.js simulate --flag checkout_copy --event checkout_click --rates control=0.2,urgent=0.05 --users 500
          for i in 1 2 3 4 5 6; do node bin/flagkit.js watch --once | tee watch.txt; grep -q 'filed\|already pending' watch.txt && break; sleep 20; done
          grep -q 'clearly worse' watch.txt
          node bin/flagkit.js approvals | grep -q 'ship_winner'

      - name: Kill-switch skill end to end (snapshot → kill → verify → trail → rollback)
        run: |
          source flagsmith.env
          export FLAGSMITH_ENVIRONMENT=$FLAGSMITH_ENV_STAGING
          S=skills/flagsmith-kill-switch/scripts
          $S/suspects.sh cta color
          rb=$($S/snapshot.sh cta_color | tee snap.txt | sed -n 's/^ROLLBACK: //p')
          cat snap.txt
          $S/kill.sh cta_color | tee kill.txt
          grep -q 'eval: 5/5 fresh users get it OFF' kill.txt
          $S/trail.sh cta_color "CI drill" "$rb"
          eval "$rb"
          test "$(flagsmith flag get cta_color --jq .enabled)" = true

      - name: Report as a GitHub Action (the reusable lqmon/toggle_wars/report action)
        uses: ./report
        with:
          experiment-id: '1'
          environment-key: ${{ env.DEV_KEY }}
          admin-key: ${{ env.ADMIN_KEY }}
          api-url: http://localhost:8000
          comment-on-pr: 'false'

      - name: MCP server (agent proposes, nothing applied without a human)
        run: node test/mcp-smoke.mjs

      - name: Audited changes, guards, revert, promote, schedules
        run: |
          set -euo pipefail
          fk() { node bin/flagkit.js "$@"; }
          refused() { if fk "$@" > refused.txt 2>&1; then echo "expected a refusal: $*"; exit 1; fi; cat refused.txt; }
          fk set cta_color --env Development --value teal --actor ci > out.txt; cat out.txt
          ID=$(grep -o 'aud_[0-9a-f]*' out.txt | head -1)
          refused set cta_color --env Production --off --actor ci        # Production needs a reason
          grep -q 'reason is required' refused.txt
          refused set hero_headline --env Development --off --actor ci   # locked: running experiment
          grep -q 'running experiment' refused.txt
          fk audit --flag cta_color > audit.txt; grep -q 'control → on teal' audit.txt
          fk revert "$ID" --actor ci
          fk promote Development Staging > promote.txt; cat promote.txt
          fk schedule add --flag cta_color --env Staging --off --at "$(date -u -d '+3 seconds' +%FT%TZ)" --actor ci --reason ci
          sleep 5; fk schedule run > sched.txt; cat sched.txt; grep -q ' done ' sched.txt
          fk set cta_color --env Staging --on --actor ci --reason "ci cleanup"

      - name: Admin panel (token, host and origin checks; a change through the API)
        run: |
          set -euo pipefail
          node bin/flagkit.js panel > panel.log 2>&1 &
          for i in $(seq 1 30); do grep -q '#t=' panel.log && break; sleep 1; done
          T=$(grep -o '#t=[^ ]*' panel.log | cut -c4-); echo "::add-mask::$T"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4100/api/flags)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:4100' -H "X-FlagKit-Token: $T" localhost:4100/api/flags)" = 421
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-FlagKit-Token: $T" -H 'Origin: http://evil.example' -H 'X-Actor: ci' -H 'Content-Type: application/json' -d '{}' localhost:4100/api/flags/set)" = 403
          curl -sf -H "X-FlagKit-Token: $T" localhost:4100/api/flags > flags.json; jq -e '.flags | length > 0' flags.json
          curl -sf -X POST -H "X-FlagKit-Token: $T" -H 'X-Actor: ci' -H 'Content-Type: application/json' -d '{"flag":"cta_color","env":"Development","enabled":false}' localhost:4100/api/flags/set > set.json
          jq -e '.via == "panel"' set.json
          node bin/flagkit.js set cta_color --env Development --on --actor ci

      - name: lint + codegen (a typo in code is a CI failure with a suggestion)
        run: |
          set -euo pipefail
          node bin/flagkit.js codegen --out "$RUNNER_TEMP/flags.generated.ts"
          grep -q 'export type FlagName' "$RUNNER_TEMP/flags.generated.ts"
          mkdir -p "$RUNNER_TEMP/lintme" && echo "flagsmith.hasFeature('hero_headlin')" > "$RUNNER_TEMP/lintme/a.js"
          if node bin/flagkit.js lint --code "$RUNNER_TEMP/lintme" --format text > lint.txt; then echo "lint should fail"; exit 1; fi
          cat lint.txt; grep -q 'Did you mean "hero_headline"' lint.txt

      - name: Starter templates (flags created, typed, every flag state on every page)
        run: |
          set -euo pipefail
          for t in express react; do
            node bin/flagkit.js init $t "$RUNNER_TEMP/$t"
            ( cd "$RUNNER_TEMP/$t" && npm pkg set "devDependencies.flagsmith-kit=file:$GITHUB_WORKSPACE" && npm install --no-audit --no-fund && npm test )
          done
          ( cd "$RUNNER_TEMP/react" && npx vite build )
          ( cd "$RUNNER_TEMP/express" && npx flagkit lint --flags-file src/flags.generated.js )
          ( cd "$RUNNER_TEMP/express" && PORT=3311 node src/server.js > "$RUNNER_TEMP/express.log" 2>&1 & )
          for i in $(seq 1 20); do curl -s localhost:3311/health > /dev/null && break; sleep 1; done
          curl -sI localhost:3311/ > headers.txt; grep -qi 'x-flags-source: flagsmith' headers.txt
          node bin/flagkit.js set maintenance_mode --env Development --on --actor ci
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3311/)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3311/health)" = 200
          node bin/flagkit.js set maintenance_mode --env Development --off --actor ci
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3311/)" = 200

      - name: Snapshot save → change → restore
        run: |
          set -euo pipefail
          node bin/flagkit.js snapshot save ci
          node bin/flagkit.js set cta_color --env Development --value teal --actor ci
          node bin/flagkit.js snapshot restore ci --yes
          node bin/flagkit.js audit --flag cta_color >/dev/null
          node -e "import('./src/experiment.js').then(async (m) => { const s = (await import('./src/config.js')).loadState(); const f = await (await import('./src/flags.js')).loadFlags(m.adminOf(s), { projectId: s.project.id, environments: s.environments }); if (f.find((x) => x.name === 'cta_color').envs.Development.value !== 'control') process.exit(1); })"
          node bin/flagkit.js doctor

      - name: Security posture
        run: |
          # admin API must not be reachable on the runner's non-loopback address
          ip=$(hostname -I | awk '{print $1}')
          ! curl -fs -m 3 "http://$ip:8000/health"
          # sign-up must be closed
          code=$(curl -s -o /dev/null -w '%{http_code}' -XPOST -H 'Content-Type: application/json' -d '{}' localhost:8000/api/v1/auth/users/)
          test "$code" != 400

      - name: Logs on failure
        if: failure()
        run: docker compose -p flagkit -f stack/docker-compose.yml --env-file .flagkit/stack.env logs --tail 200
